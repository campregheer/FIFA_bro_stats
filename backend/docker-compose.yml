services:
  postgres:
    image: postgres:16
    container_name: fifabrostats-db
    environment:
      POSTGRES_DB: fifabrostats
      POSTGRES_USER: fifabrostats
      POSTGRES_PASSWORD: fifabrostats
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: